<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" data-theme="light" role="img"><title>Minh Tran — about</title><style>text{font-family:JetBrains Mono, Fira Code, Consolas, monospace;}@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}.cur{animation:blink 1s step-end infinite}.s0c{animation:fadein 0.35s ease-out 0.0s both}.s0o0{animation:fadein 0.35s ease-out 0.25s both}.s0o1{animation:fadein 0.35s ease-out 0.3s both}.s0o2{animation:fadein 0.35s ease-out 0.35s both}.s1c{animation:fadein 0.35s ease-out 0.4s both}.s1o0{animation:fadein 0.35s ease-out 0.65s both}.s1o1{animation:fadein 0.35s ease-out 0.7s both}.s1o2{animation:fadein 0.35s ease-out 0.75s both}.s1o3{animation:fadein 0.35s ease-out 0.8s both}.s2c{animation:fadein 0.35s ease-out 0.85s both}</style><rect width="860" height="300" rx="8" fill="#ffffff"/><rect width="860" height="28" rx="8" fill="#f6f8fa"/><rect y="20" width="860" height="8" fill="#f6f8fa"/><circle cx="14" cy="14" r="5" fill="#ff5f57"/><circle cx="30" cy="14" r="5" fill="#febc2e"/><circle cx="46" cy="14" r="5" fill="#28c840"/><text x="430.0" y="18" fill="#57606a" font-size="12" font-weight="normal" text-anchor="middle" xml:space="preserve">m1trn@github ~ $ ./profile --about</text><rect x="0.5" y="0.5" width="859" height="299" rx="8" fill="none" stroke="#d0d7de"/><text x="24" y="52" font-size="13" xml:space="preserve" class="s0c"><tspan fill="#39d353">m1trn@github ~ $</tspan><tspan fill="#24292f"> whoami</tspan></text><text x="24" y="71" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s0o0">Currently, I’m studying computer science and math at MIT. I continue to branch out and explore</text><text x="24" y="90" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s0o1">how advances in ML, computing, and artificial intelligence are changing the way we create</text><text x="24" y="109" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s0o2">problems. And I’ve only gotten started.</text><text x="24" y="147" font-size="13" xml:space="preserve" class="s1c"><tspan fill="#39d353">m1trn@github ~ $</tspan><tspan fill="#24292f"> cat mindset.txt</tspan></text><text x="24" y="166" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s1o0">I consistently aim to create meaningful impact by applying analytical reasoning and critical</text><text x="24" y="185" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s1o1">thinking while remaining open to diverse perspectives. I'm curious about how ML &amp; AI can improve</text><text x="24" y="204" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s1o2">productivity, globalize social connections, and determine what comes next. I'm always thinking,</text><text x="24" y="223" fill="#24292f" font-size="13" font-weight="normal" text-anchor="start" xml:space="preserve" class="s1o3">hence always iterating, building, and taking risks.</text><text x="24" y="261" font-size="13" xml:space="preserve" class="s2c"><tspan fill="#39d353">m1trn@github ~ $</tspan><tspan fill="#24292f"> echo &quot;Reach out; I'd be more than happy to connect.&quot;</tspan><tspan fill="#39d353" class="cur">▌</tspan></text></svg>